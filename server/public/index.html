<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방콕·파타야 트립</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <nav class="topbar">
    <div class="brand">🌴 방콕·파타야 트립</div>
    <button class="tab active" data-view="itinerary">일정</button>
    <button class="tab" data-view="expenses">가계부</button>
    <button class="tab" data-view="gallery">사진</button>
    <div class="spacer"></div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </nav>

  <main class="wrap">
    <section class="view active" id="view-itinerary">
      <div id="daysContainer"><p class="empty-hint">불러오는 중…</p></div>
      <button class="btn" id="addDayBtn" style="margin-top: 10px;">+ 날짜 추가</button>
    </section>

    <section class="view" id="view-expenses">
      <div class="summary-strip" id="summaryStrip"></div>

      <form class="inline-form" id="expenseForm">
        <div class="form-grid">
          <div class="form-row"><label class="form-label">날짜</label><input class="form-input" type="date" name="date" required></div>
          <div class="form-row"><label class="form-label">분류</label>
            <select class="form-input" name="category">
              <option>숙소</option><option>교통</option><option>식비</option>
              <option>액티비티</option><option>쇼핑</option><option>마사지</option><option>기타</option>
            </select>
          </div>
          <div class="form-row"><label class="form-label">내용</label><input class="form-input" name="description" placeholder="예: 뿌펜 저녁"></div>
          <div class="form-row"><label class="form-label">금액(밧)</label><input class="form-input" type="number" step="0.01" name="amount_thb" required></div>
          <div class="form-row"><label class="form-label">결제자</label><input class="form-input" name="payer" placeholder="예: A가족"></div>
          <div class="form-row"><label class="form-label">메모</label><input class="form-input" name="memo"></div>
        </div>
        <div class="btn-bar"><button class="btn btn-primary" type="submit">지출 추가</button></div>
      </form>

      <div class="table-wrap" style="margin-top:16px;">
        <table>
          <thead><tr><th>날짜</th><th>분류</th><th>내용</th><th>결제자</th><th>메모</th><th style="text-align:right">금액(밧)</th><th></th></tr></thead>
          <tbody id="expenseRows"></tbody>
        </table>
      </div>
    </section>

    <section class="view" id="view-gallery">
      <form class="inline-form" id="imageForm">
        <div class="form-grid">
          <div class="form-row"><label class="form-label">사진 파일</label><input class="form-input" type="file" name="file" accept="image/*" required></div>
          <div class="form-row"><label class="form-label">캡션</label><input class="form-input" name="caption" placeholder="예: 뤼드시암 호텔 로비"></div>
          <div class="form-row"><label class="form-label">관련 날짜</label><select class="form-input" name="day_id" id="imageDaySelect"><option value="">선택 안함</option></select></div>
        </div>
        <div class="btn-bar"><button class="btn btn-primary" type="submit">업로드</button></div>
      </form>
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
