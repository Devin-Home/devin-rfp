<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>방콕·파타야 트립</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-plane" viewBox="0 0 24 24"><path d="M17.8 19.2 16 11l3.5-3.5c.8-.8.8-2.2 0-3s-2.2-.8-3 0L13 8l-8.2-1.8c-.4-.1-.8.1-1 .4l-.3.6c-.2.4-.1.8.2 1.1L9 12l-3 3H3l-1 2 3 1 1 3 2-1v-3l3-3 3.3 5.3c.3.3.7.4 1.1.2l.6-.3c.3-.2.5-.6.4-1Z"/></symbol>
      <symbol id="i-temple" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2 14 6h-4l2-3.8Z"/><path d="M12 5 9 9h6l-3-4Z"/><rect x="7" y="9" width="10" height="9"/><rect x="4" y="19.5" width="16" height="1.6" rx=".8"/></symbol>
      <symbol id="i-pawprint" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="16" r="3.4"/><circle cx="6.5" cy="10" r="1.8"/><circle cx="11" cy="7" r="1.8"/><circle cx="15.5" cy="7.5" r="1.8"/><circle cx="18.5" cy="11.5" r="1.8"/></symbol>
      <symbol id="i-van" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8.5" width="14" height="7.5" rx="1.6"/><path d="M16.5 11h2.6l2 2.6V16h-4.6"/><circle cx="7" cy="17.5" r="1.7"/><circle cx="16" cy="17.5" r="1.7"/></symbol>
      <symbol id="i-anchor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5.5" r="2"/><path d="M12 7.5v11.5"/><path d="M8.2 11h7.6"/><path d="M5.5 14.5a6.5 6.5 0 0 0 13 0"/></symbol>
      <symbol id="i-droplet" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5s6.2 7.4 6.2 11.6a6.2 6.2 0 1 1-12.4 0C5.8 9.9 12 2.5 12 2.5Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2.5 12h3M18.5 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
      <symbol id="i-bag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></symbol>
      <symbol id="i-suitcase" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="8" width="17" height="11" rx="2"/><path d="M9 8V6.3A2.3 2.3 0 0 1 11.3 4h1.4A2.3 2.3 0 0 1 15 6.3V8"/><path d="M3.5 13h17"/></symbol>
    </defs>
  </svg>

  <nav class="topbar">
    <div class="brand">🌴 방콕·파타야 트립</div>
    <div class="tabs" id="tabs">
      <button class="tab active" data-view="itinerary">일정</button>
      <button class="tab" data-view="expenses">가계부</button>
      <button class="tab" data-view="gallery">사진</button>
      <div class="tab-pill" id="tabPill"></div>
    </div>
    <div class="spacer"></div>
    <button class="logout-btn" id="logoutBtn">로그아웃</button>
  </nav>

  <main class="wrap">
    <section class="view active" id="view-itinerary">
      <div class="view-head">
        <h2>일정</h2>
        <span class="sub">언제든 수정 가능</span>
      </div>
      <div id="daysContainer">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>
      <button class="btn" id="addDayBtn" style="margin-top: 10px;">+ 날짜 추가</button>
    </section>

    <section class="view" id="view-expenses">
      <div class="view-head">
        <h2>가계부</h2>
        <label class="fx-control">환율 1밧 = <input class="form-input fx-input mono" type="number" step="0.1" min="0.1" id="fxRate"> 원</label>
      </div>

      <div class="seg-filter" id="paymentFilter">
        <button class="seg active" type="button" data-filter="all">전체</button>
        <button class="seg" type="button" data-filter="카드">카드</button>
        <button class="seg" type="button" data-filter="현금">현금</button>
      </div>

      <div class="summary-strip" id="summaryStrip"></div>

      <form class="inline-form" id="expenseForm">
        <div class="form-grid">
          <div class="form-row"><label class="form-label">날짜</label><input class="form-input" type="date" name="date" required></div>
          <div class="form-row"><label class="form-label">분류</label>
            <select class="form-input" name="category">
              <option>숙소</option><option>교통</option><option>식비</option>
              <option>액티비티</option><option>쇼핑</option><option>마사지</option><option>기타</option>
            </select>
          </div>
          <div class="form-row"><label class="form-label">결제수단</label>
            <select class="form-input" name="payment_method">
              <option>카드</option><option>현금</option>
            </select>
          </div>
          <div class="form-row"><label class="form-label">내용</label><input class="form-input" name="description" placeholder="예: 뿌펜 저녁"></div>
          <div class="form-row"><label class="form-label">결제 금액(밧)</label><input class="form-input" type="number" step="0.01" name="amount_thb" required></div>
          <div class="form-row"><label class="form-label">결제자</label><input class="form-input" name="payer" placeholder="예: A가족"></div>
          <div class="form-row"><label class="form-label">메모</label><input class="form-input" name="memo"></div>
        </div>
        <div class="btn-bar"><button class="btn btn-primary" type="submit">지출 추가</button></div>
      </form>

      <div class="table-wrap" style="margin-top:16px;">
        <table>
          <thead><tr><th>날짜</th><th>분류</th><th>결제수단</th><th>내용</th><th>결제자</th><th>메모</th><th style="text-align:right">금액</th><th></th></tr></thead>
          <tbody id="expenseRows"></tbody>
        </table>
      </div>
    </section>

    <section class="view" id="view-gallery">
      <div class="view-head">
        <h2>사진</h2>
        <span class="sub">참고 이미지 업로드</span>
      </div>
      <form class="inline-form" id="imageForm">
        <div class="form-grid">
          <div class="form-row"><label class="form-label">사진 파일</label><input class="form-input" type="file" name="file" accept="image/*" required></div>
          <div class="form-row"><label class="form-label">캡션</label><input class="form-input" name="caption" placeholder="예: 뤼드시암 호텔 로비"></div>
          <div class="form-row"><label class="form-label">관련 날짜</label><select class="form-input" name="day_id" id="imageDaySelect"><option value="">선택 안함</option></select></div>
        </div>
        <div class="btn-bar"><button class="btn btn-primary" type="submit">업로드</button></div>
      </form>
      <div id="galleryGrid"></div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="divider"></div>
    🌴 방콕·파타야 트립 · 2027.01.26 – 02.03
  </footer>

  <div class="lightbox" id="lightbox"><img id="lightboxImg" alt=""></div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
